name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      # Every suite named here is invoked by validate.sh via scripts/test_portable.py;
      # they are listed separately so a regression is attributable in the log.
      - name: Security regression suites
        run: |
          python3 scripts/test_secure_output.py
          python3 scripts/test_finding2.py
          python3 scripts/test_finding4.py
          python3 scripts/test_finding5.py
          python3 scripts/test_finding6.py
          python3 scripts/test_finding7.py
          python3 scripts/test_security_fixes.py
          python3 scripts/test_remediation.py

      - name: QML structural and runtime-warning suites
        run: |
          python3 scripts/test_qml_warnings.py
          python3 scripts/test_panel_reopen_libraries.py

      - name: v1.1 remediation regression suite
        run: python3 scripts/test_v11_remediation.py

      - name: Positioner anchor scan
        run: python3 scripts/check_positioner_anchors.py

      - name: Run portable validation suite
        run: ./scripts/validate.sh

      - name: Validate basic manifest fields
        run: |
          # Basic manifest structure validation
          jq -e '.schemaVersion == 1' manifest.json
          jq -e '.id == "roddy.seafile"' manifest.json
          jq -e '.kinds | index("bar-widget")' manifest.json
          jq -e '.entryPoints.barWidget' manifest.json
          jq -e '.barWidget.schema[] | select(.key == "autoLogin")' manifest.json
          jq -e '.barWidget.schema[] | select(.key == "foldersFirst")' manifest.json
          # Version must stay in sync with the value shown in Settings > About.
          test "$(jq -r .version manifest.json)" = \
            "$(grep -o 'pluginVersion: "[0-9.]*"' Panel.qml | grep -o '[0-9.]*')"
          grep -q "\[$(jq -r .version manifest.json)\]" CHANGELOG.md
          echo "Manifest validation passed"

      - name: Check for forbidden patterns
        run: |
          # No hardcoded private IPs
          if grep -rE "192\.168\.[0-9]+\.[0-9]+" --include="*.qml" --include="*.js" .; then
            echo "FAIL: Hardcoded private IP found"
            exit 1
          fi
          # No hardcoded localhost with port
          if grep -rE "localhost:[0-9]+" --include="*.qml" --include="*.js" . | grep -v "placeholderText"; then
            echo "FAIL: Hardcoded localhost:port found"
            exit 1
          fi
          echo "Forbidden pattern checks passed"

      - name: Verify required files exist
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f BarWidget.qml
          test -f Panel.qml
          test -f components/SettingsDialog.qml
          test -f js/Auth.qml
          test -f js/SeafileAPI.qml
          test -f js/TransferService.qml
          echo "Required files present"

      - name: Check keybindings consistency
        run: |
          test -f docs/KEYBINDINGS.md
          grep -Eq 'sequence:[[:space:]]*"F2"' Panel.qml
          grep -q "onDeleteRequested\|pickDelete" Panel.qml
          grep -q "onCloseRequested\|close()" Panel.qml
          echo "Keybindings consistency passed"

      - name: Check shell syntax
        run: shellcheck deploy.sh

      - name: Deploy dry-run
        run: |
          export OMARCHY_PLUGIN_DIR="$RUNNER_TEMP/roddy.seafile"
          ./deploy.sh
          ./deploy.sh --check

  # Note: Runtime validation (omarchy plugin validate, Quickshell load test,
  # real Seafile API tests) requires an Omarchy environment and runs locally.
